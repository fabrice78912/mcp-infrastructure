name: Deploy MCP Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev or prod)'
        required: true
        type: choice
        options:
          - dev
          - prod
      action:
        description: 'Terraform action to perform'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action }} - ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    # Permissions nécessaires pour OIDC
    permissions:
      id-token: write      # Requis pour obtenir le token OIDC
      contents: read       # Requis pour checkout

    defaults:
      run:
        working-directory: environments/${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Utilise le secret AWS_ROLE_ARN (à configurer dans GitHub Secrets)
          # Obtenir la valeur: cd bootstrap && terraform output github_actions_role_arn
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-Terraform-${{ github.run_id }}
          aws-region: ca-central-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="ibm_mq_host=${{ secrets.IBM_MQ_HOST }}" \
            -var="ibm_mq_port=${{ secrets.IBM_MQ_PORT }}" \
            -var="ibm_mq_channel=${{ secrets.IBM_MQ_CHANNEL }}" \
            -var="ibm_mq_password=${{ secrets.IBM_MQ_PASSWORD }}" \
            -var="mdmae_url=${{ secrets.MDMAE_URL }}" \
            -out=tfplan
        continue-on-error: true

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.event.inputs.environment }}-${{ github.run_number }}
          path: environments/${{ github.event.inputs.environment }}/tfplan
          retention-days: 30

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply' && steps.plan.outcome == 'success'
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: |
          terraform destroy -auto-approve \
            -var="ibm_mq_host=${{ secrets.IBM_MQ_HOST }}" \
            -var="ibm_mq_port=${{ secrets.IBM_MQ_PORT }}" \
            -var="ibm_mq_channel=${{ secrets.IBM_MQ_CHANNEL }}" \
            -var="ibm_mq_password=${{ secrets.IBM_MQ_PASSWORD }}" \
            -var="mdmae_url=${{ secrets.MDMAE_URL }}"

      - name: Terraform Output
        if: github.event.inputs.action == 'apply'
        run: terraform output -json > outputs.json

      - name: Upload Terraform Outputs
        if: github.event.inputs.action == 'apply'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ github.event.inputs.environment }}-${{ github.run_number }}
          path: environments/${{ github.event.inputs.environment }}/outputs.json
          retention-days: 90

      - name: Comment PR with Plan
        if: github.event.inputs.action == 'plan' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Plan \`${{ github.event.inputs.environment }}\`

            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });