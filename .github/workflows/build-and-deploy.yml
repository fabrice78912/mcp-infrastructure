name: Build and Deploy MCP Application

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'pom.xml'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - prod
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx3072m'

jobs:
  build:
    name: Build Java Application
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      git-sha: ${{ steps.version.outputs.git-sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'corretto'
          cache: 'maven'

      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          fi

          GIT_SHA=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "git-sha=$GIT_SHA" >> $GITHUB_OUTPUT
          echo "build-time=$BUILD_TIME" >> $GITHUB_OUTPUT

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Run Tests
        run: mvn test

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-jars
          path: target/*.jar
          retention-days: 30

  upload-to-s3:
    name: Upload JARs to S3
    needs: build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        lambda:
          - client_profile_reader
          - name_validator
          - mdmae_client
          - fcc_sender
          - human_review_handler
          - mq_poller
          - fcc_response_processor

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: lambda-jars

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ca-central-1

      - name: Upload to S3 with Metadata
        run: |
          BUCKET_NAME="mcp-lambda-artifacts-ca-central-1"
          JAR_FILE="${{ matrix.lambda }}.jar"
          VERSION="${{ needs.build.outputs.version }}"
          GIT_SHA="${{ needs.build.outputs.git-sha }}"

          aws s3 cp $JAR_FILE s3://$BUCKET_NAME/$JAR_FILE \
            --metadata "version=$VERSION,git-sha=$GIT_SHA,build-time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --no-progress

          echo "Uploaded $JAR_FILE (version: $VERSION, SHA: $GIT_SHA)"

  deploy-terraform:
    name: Deploy Infrastructure with Terraform
    needs: [build, upload-to-s3]
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

    defaults:
      run:
        working-directory: environments/${{ env.ENVIRONMENT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ca-central-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply Lambdas
        run: |
          terraform apply -auto-approve \
            -var="code_version=${{ needs.build.outputs.version }}" \
            -var="ibm_mq_host=${{ secrets.IBM_MQ_HOST }}" \
            -var="ibm_mq_port=${{ secrets.IBM_MQ_PORT }}" \
            -var="ibm_mq_channel=${{ secrets.IBM_MQ_CHANNEL }}" \
            -var="ibm_mq_password=${{ secrets.IBM_MQ_PASSWORD }}" \
            -var="mdmae_url=${{ secrets.MDMAE_URL }}" \
            -target=module.lambda